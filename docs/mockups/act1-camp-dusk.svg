<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Mockup Acte 1 · Campement au crepuscule · Carnac">

  <title>Carnac · Acte 1 · Campement au crepuscule</title>
  <desc>Mockup iso ortho du campement de la tribu de Kel au crepuscule, avec Athro (ancien), Vann (pair), Nia (enfant) et Kel (joueuse), palette section 3 charte, etoile de l'Est levante.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B2432"/>
      <stop offset="45%" stop-color="#3D4A55"/>
      <stop offset="75%" stop-color="#E8A952"/>
      <stop offset="100%" stop-color="#C89060"/>
    </linearGradient>

    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3D4A55"/>
      <stop offset="100%" stop-color="#2A3540"/>
    </linearGradient>

    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A65F35"/>
      <stop offset="100%" stop-color="#7C4A28"/>
    </linearGradient>

    <radialGradient id="firelight" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F0783C" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#E8A952" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#E8A952" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="starglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#E8DFC8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#E8A952" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E8A952" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- CIEL -->
  <rect x="0" y="0" width="1200" height="360" fill="url(#sky)"/>

  <!-- ETOILE DE L'EST (bas-droite du ciel, au-dessus de la mer) -->
  <circle cx="1000" cy="300" r="40" fill="url(#starglow)"/>
  <circle cx="1000" cy="300" r="3" fill="#E8DFC8"/>

  <!-- MER D'ARDOISE -->
  <rect x="0" y="360" width="1200" height="60" fill="url(#sea)"/>
  <!-- Reflets or sur la mer -->
  <line x1="200" y1="378" x2="260" y2="378" stroke="#E8A952" stroke-opacity="0.35" stroke-width="1"/>
  <line x1="450" y1="385" x2="520" y2="385" stroke="#E8A952" stroke-opacity="0.3" stroke-width="1"/>
  <line x1="700" y1="380" x2="770" y2="380" stroke="#E8A952" stroke-opacity="0.4" stroke-width="1"/>
  <line x1="950" y1="388" x2="1010" y2="388" stroke="#E8A952" stroke-opacity="0.5" stroke-width="1"/>

  <!-- SOL (grand quad iso) -->
  <polygon points="0,420 1200,420 1200,750 0,750" fill="url(#ground)"/>

  <!-- Touffes d'herbe et ajoncs disperses -->
  <g fill="#5C7A3C" opacity="0.7">
    <polygon points="140,540 145,525 150,540"/>
    <polygon points="160,555 165,540 170,555"/>
    <polygon points="920,620 928,600 936,620"/>
    <polygon points="1050,660 1058,640 1066,660"/>
    <polygon points="380,700 388,680 396,700"/>
    <polygon points="220,700 228,680 236,700"/>
  </g>

  <g fill="#E8A952" opacity="0.6">
    <circle cx="145" cy="528" r="3"/>
    <circle cx="165" cy="543" r="3"/>
    <circle cx="928" cy="602" r="3"/>
    <circle cx="1058" cy="642" r="3"/>
    <circle cx="388" cy="682" r="3"/>
  </g>

  <!-- ROCHERS granit (formes dodecaedre stylisees) -->
  <g fill="#7C7873" stroke="#4A4844" stroke-width="1">
    <polygon points="80,600 110,580 145,590 155,620 130,640 90,635"/>
    <polygon points="1080,690 1120,670 1160,680 1170,715 1140,735 1090,725"/>
    <polygon points="920,510 940,498 962,505 970,525 950,540 918,535"/>
  </g>

  <!-- HUTTES DE TORCHIS (droite arriere) -->
  <g>
    <!-- Hutte 1 -->
    <polygon points="820,530 900,470 980,530 980,610 820,610" fill="#8C6543"/>
    <!-- Toit chaume -->
    <polygon points="810,530 900,455 990,530" fill="#5C3E28"/>
    <!-- Ouverture sombre -->
    <rect x="880" y="555" width="40" height="55" fill="#1B1108"/>
    <!-- Ombre au sol -->
    <ellipse cx="900" cy="618" rx="90" ry="10" fill="#4A2818" opacity="0.5"/>

    <!-- Hutte 2 plus petite arriere -->
    <polygon points="1020,540 1075,495 1130,540 1130,600 1020,600" fill="#7C5836"/>
    <polygon points="1012,540 1075,485 1138,540" fill="#4E3220"/>
    <rect x="1065" y="562" width="24" height="38" fill="#1B1108"/>
    <ellipse cx="1075" cy="608" rx="62" ry="7" fill="#4A2818" opacity="0.45"/>
  </g>

  <!-- HALO DE FEU au sol -->
  <ellipse cx="620" cy="600" rx="280" ry="140" fill="url(#firelight)"/>

  <!-- FEU DE CAMP (centre) -->
  <g>
    <!-- Cercle de pierres foyer -->
    <ellipse cx="620" cy="605" rx="55" ry="20" fill="#4A4844"/>
    <ellipse cx="620" cy="600" rx="48" ry="15" fill="#2A1E1A"/>
    <!-- Buches -->
    <rect x="600" y="575" width="40" height="6" fill="#5C3E28" transform="rotate(15 620 578)"/>
    <rect x="600" y="583" width="40" height="6" fill="#5C3E28" transform="rotate(-25 620 586)"/>
    <!-- Flamme -->
    <polygon points="605,585 620,530 635,585" fill="#F0783C"/>
    <polygon points="612,585 620,555 628,585" fill="#E8DFC8"/>
    <!-- Cendres -->
    <circle cx="612" cy="540" r="1.5" fill="#E8A952" opacity="0.7"/>
    <circle cx="628" cy="525" r="1.2" fill="#E8A952" opacity="0.6"/>
    <circle cx="619" cy="515" r="1" fill="#E8A952" opacity="0.5"/>
  </g>

  <!-- ATHRO (ancien, arriere-gauche du feu, debout, bâton, courbe) -->
  <g>
    <ellipse cx="510" cy="618" rx="35" ry="8" fill="#2A1E1A" opacity="0.55"/>
    <!-- Bâton -->
    <line x1="475" y1="490" x2="490" y2="618" stroke="#5C3E28" stroke-width="3"/>
    <!-- Corps courbe -->
    <path d="M 500,620 L 500,545 Q 500,530 512,528 L 528,528 Q 545,530 545,555 L 545,620 Z" fill="#5C3E28"/>
    <!-- Tete -->
    <circle cx="522" cy="510" r="16" fill="#4E3728"/>
    <!-- Cheveux blancs -->
    <path d="M 508,505 Q 508,495 515,494 L 530,494 Q 538,495 538,505 L 538,510 L 508,510 Z" fill="#E8DFC8" opacity="0.85"/>
    <!-- Barbe blanche -->
    <path d="M 514,520 Q 514,540 522,542 Q 530,540 530,520 Z" fill="#E8DFC8" opacity="0.75"/>
  </g>

  <!-- KEL (joueuse, assise pres du feu, avant-gauche, cheveux longs) -->
  <g>
    <ellipse cx="565" cy="655" rx="30" ry="7" fill="#2A1E1A" opacity="0.6"/>
    <!-- Corps assis -->
    <path d="M 545,655 L 545,600 Q 545,585 560,585 L 580,585 Q 595,585 595,605 L 595,655 Z" fill="#A65F35"/>
    <!-- Jambes repliees -->
    <ellipse cx="570" cy="670" rx="30" ry="8" fill="#5C3E28"/>
    <!-- Bras replies -->
    <ellipse cx="545" cy="620" rx="8" ry="18" fill="#6B4A38"/>
    <ellipse cx="595" cy="620" rx="8" ry="18" fill="#6B4A38"/>
    <!-- Tete -->
    <circle cx="572" cy="572" r="14" fill="#6B4A38"/>
    <!-- Cheveux longs sombres -->
    <path d="M 560,565 Q 560,555 570,553 L 578,553 Q 588,555 588,568 L 590,595 Q 585,595 585,580 L 585,570 Q 575,570 572,585 L 570,595 Q 560,595 560,580 Z" fill="#2A1E1A"/>
    <!-- Traits ocre sur pommettes -->
    <line x1="566" y1="575" x2="569" y2="577" stroke="#C89060" stroke-width="1.5"/>
    <line x1="580" y1="575" x2="583" y2="577" stroke="#C89060" stroke-width="1.5"/>
  </g>

  <!-- VANN (pair, accroupi avant-droite, ramassant) -->
  <g>
    <ellipse cx="740" cy="670" rx="30" ry="7" fill="#2A1E1A" opacity="0.6"/>
    <!-- Corps accroupi -->
    <path d="M 725,668 L 725,610 Q 725,595 740,595 L 758,595 Q 773,595 773,615 L 773,668 Z" fill="#8C5028"/>
    <!-- Bras tendu vers le sol -->
    <path d="M 720,625 Q 705,650 700,675 L 710,678 Q 715,655 730,635 Z" fill="#6B4A38"/>
    <!-- Filet a la ceinture -->
    <ellipse cx="777" cy="628" rx="10" ry="14" fill="#5C3E28"/>
    <!-- Tete -->
    <circle cx="748" cy="582" r="14" fill="#6B4A38"/>
    <!-- Cheveux attaches -->
    <path d="M 736,576 Q 736,566 748,564 Q 760,566 760,576 L 760,588 L 736,588 Z" fill="#A65F35"/>
    <path d="M 760,580 L 770,590 L 762,595 Z" fill="#A65F35"/>
    <!-- Coquillage a ramasser -->
    <circle cx="705" cy="678" r="4" fill="#E8DFC8"/>
  </g>

  <!-- NIA (enfant, gauche, court apres la chevre) -->
  <g>
    <ellipse cx="290" cy="678" rx="18" ry="5" fill="#2A1E1A" opacity="0.5"/>
    <!-- Corps petit -->
    <path d="M 282,678 L 282,635 Q 282,624 292,624 L 302,624 Q 312,624 312,635 L 312,678 Z" fill="#C89060"/>
    <!-- Bras leves en course -->
    <path d="M 280,640 L 268,620 L 272,614 L 285,635 Z" fill="#8C6650"/>
    <path d="M 315,640 L 328,624 L 332,630 L 320,646 Z" fill="#8C6650"/>
    <!-- Tete -->
    <circle cx="297" cy="614" r="11" fill="#8C6650"/>
    <!-- Cheveux tresses -->
    <path d="M 288,610 Q 288,602 297,600 Q 306,602 306,610 L 306,620 L 288,620 Z" fill="#5C3E28"/>
    <!-- Yeux clairs -->
    <circle cx="294" cy="614" r="1.2" fill="#6D8FA8"/>
    <circle cx="300" cy="614" r="1.2" fill="#6D8FA8"/>
  </g>

  <!-- CHEVRE (avant Nia) -->
  <g>
    <ellipse cx="220" cy="683" rx="20" ry="5" fill="#2A1E1A" opacity="0.5"/>
    <!-- Corps -->
    <ellipse cx="220" cy="670" rx="22" ry="12" fill="#B5B0A8"/>
    <!-- Tete -->
    <ellipse cx="240" cy="662" rx="9" ry="7" fill="#B5B0A8"/>
    <!-- Cornes -->
    <line x1="240" y1="656" x2="245" y2="648" stroke="#4A4844" stroke-width="2"/>
    <line x1="240" y1="656" x2="235" y2="648" stroke="#4A4844" stroke-width="2"/>
    <!-- Pattes -->
    <line x1="208" y1="678" x2="208" y2="688" stroke="#4A4844" stroke-width="3"/>
    <line x1="218" y1="680" x2="218" y2="690" stroke="#4A4844" stroke-width="3"/>
    <line x1="228" y1="680" x2="228" y2="690" stroke="#4A4844" stroke-width="3"/>
    <line x1="235" y1="678" x2="235" y2="688" stroke="#4A4844" stroke-width="3"/>
  </g>

  <!-- BORDURE de composition (subtile, pour cadrer) -->
  <rect x="0" y="0" width="1200" height="750" fill="none" stroke="#2A1E1A" stroke-width="4"/>

</svg>
